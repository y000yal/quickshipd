name: Build release and Deploy to wordpress.org
on:
  release:
    types: [published]
jobs:
  release:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Without this a hung deploy sits on the runner for the 6 hour default.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and create release zip
        id: build
        run: |
          pnpm run dist
          echo "zip_path=release/quickshipd.zip" >> $GITHUB_OUTPUT

      # The deploy action apt-installs subversion when it cannot find svn, and
      # the runner's default azure mirror is often unreachable, which is what
      # makes that take minutes. Point apt at the main archive and install it
      # here, so the action finds svn already present and skips its own apt run.
      - name: Install subversion
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 subversion
          svn --version --quiet

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: quickshipd
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

      - name: Upload release asset
        run: |
          ASSET_NAME="$(basename "${{ steps.build.outputs.zip_path }}")"
          UPLOAD_URL="${{ github.event.release.upload_url }}"
          UPLOAD_URL="${UPLOAD_URL/\{?name,label\}/?name=${ASSET_NAME}}"
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"${{ steps.build.outputs.zip_path }}" \
            "${UPLOAD_URL}"
